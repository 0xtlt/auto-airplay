name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CROSS_REVISION: 8c1a8aa4b661711f4b7b6ac07c2e8929ce2f7d27

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Install pinned cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev "$CROSS_REVISION" --locked
      - name: Build release binary
        run: cross build --locked --release --target "${{ matrix.target }}"
      - name: Package release archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          archive="auto-airplay-${TARGET}.tar.gz"
          stage="dist/${TARGET}"
          mkdir -p "$stage"
          install -m 0755 "target/${TARGET}/release/auto-airplay" "$stage/auto-airplay"
          install -m 0644 packaging/auto-airplay@.service "$stage/auto-airplay@.service"
          install -m 0644 README.md LICENSE "$stage/"
          tar -C "$stage" -czf "dist/${archive}" .
          cd dist
          sha256sum "$archive" > "${archive}.sha256"
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify tag matches crate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          crate_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "v${crate_version}" = "$TAG"
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes --title "auto-airplay $TAG"
