[package]
name = "auto-airplay"
version = "0.4.0"
edition = "2024"
license = "GPL-2.0-only"
description = "A small, configurable Bluetooth/ALSA to AirPlay bridge for Raspberry Pi"
repository = "https://github.com/0xtlt/auto-airplay"
rust-version = "1.88"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
futures = "0.3"
mdns-sd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

airplay-client = { path = "vendor/airplay-client" }
airplay-core = { git = "https://github.com/lmcgartland/airplay2-rs.git", rev = "a7f019fe6246ebd9701201a8a5c31e9a15243956" }
airplay-audio = { path = "vendor/airplay-audio" }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.9"
bluer = { version = "0.17", features = ["bluetoothd"] }
crossbeam-channel = "0.5"
libc = "0.2"
zbus = { version = "5.11", default-features = false, features = ["tokio"] }

[dev-dependencies]
airplay-resampler = { git = "https://github.com/lmcgartland/airplay2-rs.git", rev = "a7f019fe6246ebd9701201a8a5c31e9a15243956" }
airplay-crypto = { git = "https://github.com/lmcgartland/airplay2-rs.git", rev = "a7f019fe6246ebd9701201a8a5c31e9a15243956" }
assert_cmd = "2.0"
predicates = "3.1"
tokio = { version = "1.47", features = ["io-util"] }

# The tests push minutes of audio through the jitter buffer and the real AirPlay
# resampler; they run with optimisations (debug assertions stay on).
[profile.test]
opt-level = 2

[profile.dev.package.rubato]
opt-level = 3

[profile.dev.package.airplay-resampler]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
