[package]
name = "airplay-audio"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0"
description = "Audio encoding and RTP streaming for AirPlay 2"
publish = false

[dependencies]
airplay-core = { git = "https://github.com/lmcgartland/airplay2-rs.git", rev = "a7f019fe6246ebd9701201a8a5c31e9a15243956" }
airplay-crypto = { git = "https://github.com/lmcgartland/airplay2-rs.git", rev = "a7f019fe6246ebd9701201a8a5c31e9a15243956" }
airplay-timing = { git = "https://github.com/lmcgartland/airplay2-rs.git", rev = "a7f019fe6246ebd9701201a8a5c31e9a15243956" }
airplay-resampler = { git = "https://github.com/lmcgartland/airplay2-rs.git", rev = "a7f019fe6246ebd9701201a8a5c31e9a15243956" }
tokio = { version = "1.37", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
symphonia = { version = "0.5", features = ["all"] }
tracing = "0.1"
socket2 = "0.5"
rand = "0.8"
crossbeam-channel = "0.5"
# Local addition: seals buffered packets (see VENDORED.md).
chacha20poly1305 = "0.10"
libc = "0.2"
spin_sleep = "1.2"

# Audio codecs
alac-encoder = "0.3"
fdk-aac = "0.6"

# Audio processing
biquad = "0.4"
